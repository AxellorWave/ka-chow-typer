services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kachow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kachow}
      POSTGRES_DB: ${POSTGRES_DB:-kachow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kachow} -d ${POSTGRES_DB:-kachow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: flask --app wsgi run --debug --host 0.0.0.0 --port 5000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kachow}:${POSTGRES_PASSWORD:-kachow}@db:5432/${POSTGRES_DB:-kachow}
      FLASK_APP: wsgi
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
