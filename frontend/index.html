<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon-120.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaChowTyper</title>
    <meta
      name="description"
      content="KaChowTyper — тренажёр слепой печати в стиле гонок: заезды на скорость, комбо, уровни, достижения и гараж для своей машины."
    />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('kachow-settings') || '{}').state || {}
        const dark = saved.theme
          ? saved.theme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.dataset.theme = 'night'
      } catch {
        document.documentElement.removeAttribute('data-theme')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
